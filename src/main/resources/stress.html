<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Browser Load Simulator</title>

<style>
body {
    background: #020617;
    color: #e2e8f0;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin: 30px 0;
}

.card {
    background: #0f172a;
    padding: 20px 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.log {
    width: 80%;
    margin: auto;
    height: 250px;
    background: black;
    color: #22c55e;
    overflow-y: auto;
    padding: 10px;
    font-family: monospace;
    text-align: left;
}
</style>
</head>

<body>

<h1>🌐 Realistic Browser Load Simulator</h1>

<div class="stats">
    <div class="card">
        <h2 id="requests">0</h2>
        <p>Total Requests</p>
    </div>
    <div class="card">
        <h2 id="success">0</h2>
        <p>Success</p>
    </div>
    <div class="card">
        <h2 id="fail">0</h2>
        <p>Failures</p>
    </div>
</div>

<div class="log" id="log"></div>

<script>
let total = 0;
let success = 0;
let fail = 0;

function log(msg) {
    const logBox = document.getElementById("log");
    logBox.innerHTML += msg + "<br>";
    logBox.scrollTop = logBox.scrollHeight;
}

function updateStats() {
    document.getElementById("requests").textContent = total;
    document.getElementById("success").textContent = success;
    document.getElementById("fail").textContent = fail;
}

async function hit(url) {
    total++;
    updateStats();

    try {
        await fetch(url);
        success++;
        log("✔ " + url);
    } catch {
        fail++;
        log("✖ " + url);
    }

    updateStats();
}

function simulateUser() {

    const resources = [
        "/index.html",
        "/style.css",
        "/app.js",
        "/image.jpg",
        "/test.txt"
    ];

    resources.forEach(r => hit(r));
}

// simulate many users gradually
for (let i = 0; i < 20; i++) {
    setTimeout(simulateUser, i * 300);
}

// continuous activity
setInterval(simulateUser, 3000);

log("Simulation started...");
</script>

</body>
</html>
